name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend Unit & Live PoB2 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Cache managed PoB2 calculation kernel
        uses: actions/cache@v4
        with:
          path: ~/.poe2-workbench/pob2-engine
          key: pob2-kernel-v2-${{ hashFiles('pob2-engine.lock') }}
      - name: Bootstrap PoB2 kernel via built-in installer (if cache miss)
        run: |
          python3 -c "
          from backend.config import managed_pob2_dir
          from backend.engine import engine_manager
          info = engine_manager.inspect_pob2_dir(managed_pob2_dir())
          if not info['valid']:
              st = engine_manager.install_from_github_zip(verify_live=True)
              assert st['ready'], f'PoB2 kernel not ready: {st}'
          else:
              engine_manager.apply_lua51_compat_patches(info['srcDir'])
          smoke = engine_manager.test_live_engine()
          assert smoke['ok'], f'PoB2 live LuaJIT smoke failed: {smoke}'
          "
      - name: Run full Python + LuaJIT test suite
        env:
          POE2_TOKEN: ci-test-token
        run: python3 -m unittest discover -s backend/tests -v

  frontend-checks:
    name: Desktop Web & Extension (Typecheck / Test / Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Desktop Web checks
        working-directory: desktop/web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Chrome Extension checks
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  tauri-check:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Cargo check
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
